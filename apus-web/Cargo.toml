[package]
name = "apus-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
smoke = []

[dependencies]
apus = { path = "..", default-features = false, features = ["resident-demo"] }
apus-desktop = { path = "../apus-desktop" }
console_error_panic_hook = "0.1"
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "KeyboardEvent"] }
wgpu = { version = "30.0.2", default-features = false, features = ["webgl", "wgsl"] }

[workspace]
