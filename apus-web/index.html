<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Apus · HG002 demo</title>
  <style>
    html { color-scheme: dark; }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      margin: 0;
      height: 100dvh;
      background: #17191d;
      color: #e2e4e9;
      font: 14px system-ui, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; outline-offset: -2px; touch-action: pinch-zoom; }
    footer { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 8px 12px; }
    #status { margin: 0; }
    a { color: inherit; }
  </style>
</head>
<body>
  <canvas tabindex="0" aria-label="Apus genome and variant viewer"></canvas>
  <footer>
    <p id="status" role="status">Loading the HG002 demo…</p>
    <span>Click, tap or Enter to open · Drag or ←/→ to pan · +/− Zoom · Tab Switch view</span>
    <a href="./data-credits.txt">Data credits</a>
    <a href="https://github.com/jaburwock/apus">Source on GitHub</a>
  </footer>
  <script type="module" src="./main.js"></script>
</body>
</html>
