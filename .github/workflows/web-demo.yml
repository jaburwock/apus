name: Build the WebGL2 demo

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install WASM tooling
        run: |
          rustup update stable
          rustup target add --toolchain stable wasm32-unknown-unknown
          cargo +stable install wasm-bindgen-cli --locked --version 0.2.130
      - name: Fetch pinned demo data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download hg002-web-demo-v3 --repo "$GITHUB_REPOSITORY" --pattern hg002-web-demo-v3.tar.gz --dir "$RUNNER_TEMP"
      - name: Build
        env:
          RUSTUP_TOOLCHAIN: stable
        run: apus-web/build.sh "$RUNNER_TEMP/hg002-web-demo-v3.tar.gz"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apus-web/dist
          retention-days: 7

  deploy:
    if: inputs.deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
