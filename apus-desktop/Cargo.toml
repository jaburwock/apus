[package]
name = "apus-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
apus = { path = "..", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
ttf-parser = "0.25"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.5", features = ["derive"] }
png = "0.18"
pollster = "0.4"
wgpu = "30.0.2"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["webgl", "wgsl"] }
